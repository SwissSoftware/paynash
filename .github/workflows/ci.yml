# Lint, test, and build the backend and the Flutter web app (task 1.6).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Lint (compiler warnings are errors)
        run: >
          ./mvnw -B -ntp clean test-compile
          -Dmaven.compiler.showWarnings=true
          -Dmaven.compiler.failOnWarning=true
          "-Dmaven.compiler.compilerArgument=-Xlint:all,-processing,-serial"
      # Testcontainers uses the Docker daemon of the runner.
      - name: Test and build
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true
      - run: flutter pub get
      - name: Lint
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build web
        run: flutter build web --release
