# On-site production setup (design D2, D11; tasks 8.1, 8.2). From deploy/:
#   cp .env.example .env   # then set POS_DB_PASSWORD
#   docker compose up -d --build
# See docs/operations.md.
name: paynash

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POS_DB_PASSWORD:?set POS_DB_PASSWORD in deploy/.env}
      TZ: Europe/Zurich
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d pos"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POS_DB_URL: jdbc:postgresql://postgres:5432/pos
      POS_DB_USER: pos
      POS_DB_PASSWORD: ${POS_DB_PASSWORD}
      # The web UI is served from the same origin; this only matters for other clients.
      POS_CORS_ALLOWED_ORIGINS: https://${POS_HOSTNAME:-pos.local}
    volumes:
      - images:/data/images
    # Not published: reachable only through Caddy (HTTPS). Printers are reached
    # from here over the LAN via the default bridge network's outbound NAT.

  web:
    build: ../app
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      POS_HOSTNAME: ${POS_HOSTNAME:-pos.local}
      POS_TLS: ${POS_TLS:-internal}
    ports:
      - "${POS_HTTP_PORT:-80}:80"
      - "${POS_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/scripts/backup.sh", "--daily"]
    environment:
      PGHOST: postgres
      PGDATABASE: pos
      PGUSER: pos
      PGPASSWORD: ${POS_DB_PASSWORD}
      TZ: Europe/Zurich
      POS_BACKUP_TIME: ${POS_BACKUP_TIME:-03:30}
      POS_BACKUP_KEEP_DAYS: ${POS_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup:/scripts:ro
      - images:/images
      - ${POS_BACKUP_DIR:-./backups}:/backups

volumes:
  db:
  images:
  caddy-data:
  caddy-config:
