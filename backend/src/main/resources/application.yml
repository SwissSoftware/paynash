spring:
  application:
    name: paynash-pos
  datasource:
    url: ${POS_DB_URL:jdbc:postgresql://localhost:5432/pos}
    username: ${POS_DB_USER:pos}
    password: ${POS_DB_PASSWORD:pos}
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Above the 5 MB image limit so oversized files reach the validator and get a clear message.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${POS_PORT:8081}

pos:
  # Origins allowed to call the API from a browser (Flutter web dev server).
  cors-allowed-origins: ${POS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  time-zone: Europe/Zurich
  # Menu item images (design D8). Must be a persistent volume in production.
  image-dir: ${POS_IMAGE_DIR:./data/images}
